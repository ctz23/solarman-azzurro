name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: PYTHONDONTWRITEBYTECODE=1 python -m unittest discover -s tests -v
  homeassistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r tests/requirements-ha.txt
      - run: ruff check --no-cache custom_components tests
      - run: pytest tests/ha -q --cov=custom_components/solarman_azzurro --cov-branch --cov-report=term-missing
